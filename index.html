  :root { --ink:#0a1238; --yellow:#ffd93b; --red:#ff5a3c; --sky:#322b6c; --logoW:min(94vw,440px); --band:calc(var(--logoW) * 0.320 + 10px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; touch-action:manipulation; }
  body { font-family:"SilesUI",system-ui,sans-serif; color:var(--ink); background:var(--sky);
    user-select:none; -webkit-user-select:none; }
  /* Cover: unten angelegt, oben weich in den Himmel auslaufend (Platz für den Titel) */
  .cover { position:absolute; left:0; top:var(--band); width:100%; height:calc(100% - var(--band)); object-fit:cover; object-position:50% 0;
    -webkit-mask-image:linear-gradient(transparent, #000 4%); mask-image:linear-gradient(transparent, #000 4%);
    animation:breathe 9s ease-in-out infinite alternate; transform-origin:50% 0; }
  @keyframes breathe { from { transform:scale(1); } to { transform:scale(1.035); } }
  .shade { position:absolute; left:0; right:0; bottom:0; height:34%; pointer-events:none;
    background:linear-gradient(transparent, rgba(16,12,40,.7)); }
  .stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:6px 14px 10px; }
  .logo { text-align:center; }
  .logo h1 { margin:0; font-family:"SilesLogo","SilesUI",sans-serif; font-size:var(--title); line-height:1; letter-spacing:-.01em; font-weight:400;
    text-transform:uppercase; white-space:nowrap; color:var(--yellow);
    -webkit-text-stroke:.14em var(--ink); paint-order:stroke fill; }
  .logo h1 span { display:inline-block; transform:translateY(var(--dy,0)) rotate(var(--r,0deg)); background:linear-gradient(#fff36b 20%, #ffb019 80%);
    filter:drop-shadow(0 .06em 0 var(--ink)) drop-shadow(.05em .07em 0 var(--red)); }
  .logo h1 span { background:none; }
  .logo h1 span:first-child { font-size:1.25em; }
  .logo h1 { animation:logoIn .6s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes logoIn { from { transform:scale(.4); opacity:0; } to { transform:scale(1); opacity:1; } }
  .logosvg { content:var(--logoMask); display:block; width:var(--logoW); height:auto; overflow:visible; animation:logoIn .6s cubic-bezier(.3,1.6,.5,1) both; }
  .snd { position:absolute; right:10px; top:calc(var(--band) + 8px); z-index:5; width:58px; height:58px; min-height:0; padding:0;
    border-radius:50%; font-size:28px; line-height:1; display:grid; place-items:center; background:#fff; }
  .tap { display:none; position:absolute; left:0; right:0; bottom:13%; text-align:center; pointer-events:none;
    font-family:"SilesLogo","SilesUI",sans-serif; text-transform:uppercase; font-size:clamp(28px,8.5vw,40px); color:#fff;
    -webkit-text-stroke:6px var(--ink); paint-order:stroke fill; animation:tapPulse .9s ease-in-out infinite alternate; }
  @keyframes tapPulse { from { transform:scale(1); opacity:.75; } to { transform:scale(1.08); opacity:1; } }
  body.locked .tap { display:block; }

<script>
  // Platzhalter-Hinweise: die echten Funktionen folgen in späteren Schritten
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }
  // Spiel starten: neu oder weiter. Lädt das Spiel noch (GitHub-Fassung), wird gewartet.
  window.startGame = (cont) => {
    if (typeof Game === 'undefined') { window.pendingStart = cont; toast('Spiel lädt …'); return; }
    window.pendingStart = undefined;
    if (!Game.start(cont)) toast('3D wird auf diesem Gerät leider nicht unterstützt.');
  };
  const btnCont = document.getElementById('btnContinue');
  function checkSave() { let has = false; try { has = !!localStorage.getItem('silesmon_save_v1'); } catch (e) {} btnCont.disabled = !has; }
  checkSave(); window.onGameStop = checkSave;
  document.getElementById('btnNew').addEventListener('click', () => startGame(false));
  btnCont.addEventListener('click', () => startGame(true));
  
  // Musik soll sofort laufen. Browser erlauben Ton aber oft erst nach einem Antippen:
  // 1) beim Laden direkt versuchen, 2) sonst Startbildschirm "Tippe zum Starten".
  const music = document.getElementById('music');
  const btnSnd = document.getElementById('btnSnd');
  let wantMusic = true;
  music.volume = 0.7;
  function showSnd() { btnSnd.textContent = wantMusic ? '\u{1F50A}' : '\u{1F507}'; }   // zeigt, ob Ton gewünscht ist
  function unlock() { document.body.classList.remove('locked'); }
  function playMusic() {
    const p = music.play();
    return (p && p.then) ? p.then(() => true, () => false) : Promise.resolve(!music.paused);
  }
  showSnd();
  playMusic().then(ok => { if (ok) unlock(); });           // Versuch ohne Antippen
  // Erster Kontakt mit dem Bildschirm startet die Musik. Auf Touch-Geräten zählt für den Browser
  // erst das Loslassen (touchend/pointerup/click) als Erlaubnis, deshalb auf alle diese Ereignisse hören.
  // Vollbild beim ersten Tipp (wo der Browser es erlaubt)
  function goFull() { try { const el = document.documentElement; if (!document.fullscreenElement && el.requestFullscreen) { const p = el.requestFullscreen({ navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } } catch (err) {} }
  function firstTouch(e) {
    if (document.body.classList.contains('locked')) unlock();
    if (e.target !== btnSnd && wantMusic && music.paused) playMusic();
    goFull();
  }
  ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, firstTouch, { passive: true }));
  btnSnd.addEventListener('click', () => {
    wantMusic = !wantMusic; window.SOUND_MUTED = !wantMusic;
    if (wantMusic) playMusic(); else music.pause();
    showSnd();
  });
  // Pausieren, wenn die Seite in den Hintergrund geht
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) music.pause();
    else if (wantMusic && !document.body.classList.contains('locked')) playMusic();
  });
  // Wiegendes Gras am unteren Rand
  const blades = document.getElementById('blades');
  for (let i = 0; i < 46; i++) {
    const b = document.createElement('b');
    b.style.left = (i / 46 * 100 + Math.random() * 2 - 1) + '%';
    b.style.height = (26 + Math.random() * 44) + 'px';
    b.style.setProperty('--t', (1.8 + Math.random() * 1.6) + 's');
    b.style.setProperty('--d', (-Math.random() * 3) + 's');
    blades.appendChild(b);
  }
  // Pusteblumen-Samen und Funkeln, die im Wind treiben
  const fxc = document.getElementById('fxc'), g = fxc.getContext('2d');
  let W = 0, H = 0, seeds = [];
  function sizeFx() {
    const r = fxc.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height; fxc.width = W * d; fxc.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
  }
  function newSeed(anywhere) {
    return { x: anywhere ? Math.random() * W : -20, y: Math.random() * H * .85, r: 1.5 + Math.random() * 2.5,
      vx: 14 + Math.random() * 26, ph: Math.random() * 6.28, sp: .6 + Math.random() * 1.2, star: Math.random() < .3 };
  }
  sizeFx(); addEventListener('resize', sizeFx);
  for (let i = 0; i < 30; i++) seeds.push(newSeed(true));
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    g.clearRect(0, 0, W, H);
    for (const s of seeds) {
      s.x += s.vx * dt; s.ph += s.sp * dt; s.y += Math.sin(s.ph) * 12 * dt - 3 * dt;
      if (s.x > W + 20 || s.y < -20) Object.assign(s, newSeed(false));
      const a = s.star ? .35 + .65 * Math.abs(Math.sin(s.ph * 2)) : .85;
      g.globalAlpha = a; g.fillStyle = '#fff';
      if (s.star) {                                   // Funkel-Stern
        const k = s.r * 2.4; g.beginPath();
        g.moveTo(s.x, s.y - k); g.quadraticCurveTo(s.x, s.y, s.x + k, s.y); g.quadraticCurveTo(s.x, s.y, s.x, s.y + k);
        g.quadraticCurveTo(s.x, s.y, s.x - k, s.y); g.quadraticCurveTo(s.x, s.y, s.x, s.y - k); g.fill();
      } else {                                        // Samen mit kleinem Stiel
        g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.3); g.fill();
        g.globalAlpha = .5; g.strokeStyle = '#fff'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.x - 3, s.y + s.r * 3); g.stroke();
      }
    }
    g.globalAlpha = 1;
    if (!document.hidden && !document.body.classList.contains('inGame')) requestAnimationFrame(frame);
  }
  window.resumeMenuFx = () => { last = performance.now(); requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { last = performance.now(); requestAnimationFrame(frame); } });
  // Cover so einpassen, dass Brisko und Siles über den Knöpfen sichtbar bleiben (kleine Bildschirme)
  const coverEl = document.querySelector('.cover'), bottomEl = document.querySelector('.bottom');
  const COVER_RATIO = 1376 / 768, NEED = 0.74;            // Figuren reichen bis ca. 74 % der Bildhöhe
  function fitCover() {
    const W = innerWidth, H = innerHeight, landscape = W > H && H <= 520;
    const band = parseFloat(getComputedStyle(coverEl).top) || 0;
    const clear = H - band - bottomEl.offsetHeight - 18;
    const s = Math.max(0.62, Math.min(1, clear / (NEED * W * COVER_RATIO)));
    const boxed = !landscape && s < 0.97;
    document.body.classList.toggle('boxed', boxed);
    document.body.style.setProperty('--cw', Math.round(W * s) + 'px');
  }
  fitCover(); addEventListener('resize', fitCover); setTimeout(fitCover, 300);
  // Neues Cover immer über die volle Breite (nie schmaler, nie verzerrt).
  // Auf kurzen Handys: erst etwas Himmel oben abschneiden, dann die Knöpfe kompakter machen,
  // damit das Logo im Bild über den Knöpfen sichtbar bleibt.
  (function () {
    const bot = document.querySelector('.bottom'), R = 1672 / 941, LOGO_END = 0.89, SKY = 0.045;
    function fit2() {
      const W = innerWidth, H = innerHeight, b = document.body;
      if (W > H && H <= 520) { b.classList.remove('compact'); b.style.setProperty('--ctop', '0px'); return; }
      const imgH = W * R;
      b.classList.remove('compact');
      let room = H - bot.offsetHeight - 16, top = Math.max(-SKY * imgH, Math.min(0, room - LOGO_END * imgH));
      if (LOGO_END * imgH + top > room) {                     // reicht noch nicht: Knöpfe in eine Reihe
        b.classList.add('compact'); room = H - bot.offsetHeight - 12;
        top = Math.max(-SKY * imgH, Math.min(0, room - LOGO_END * imgH));
      }
      b.style.setProperty('--ctop', Math.round(top) + 'px');
    }
    fit2(); addEventListener('resize', fit2); setTimeout(fit2, 300);
  })();
  // ---------- Einstellungen (Menü und im Spiel) ----------
  (function () {
    const QN = ['Niedrig', 'Mittel', 'Hoch'], QD = ['720p, weniger Gras – am flüssigsten', '900p, viel Gras', 'Full HD 1080p, alles an'];
    let q = 1; try { const v = localStorage.getItem('silesmon_quality'); if (v !== null) q = +v; } catch (e) {}
    window.SILES_Q = q;
    const p = document.createElement('div'); p.id = 'setPanel';
    p.innerHTML = '<div class="sp"><h2>Einstellungen</h2><p class="sl">Grafik</p><div class="sq"></div><p class="sd"></p><button class="sx" type="button">Fertig</button></div>';
    document.body.appendChild(p);
    const row = p.querySelector('.sq'), desc = p.querySelector('.sd');
    QN.forEach((n, i) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = n; b.onclick = () => set(i); row.appendChild(b); });
    function set(i) {
      q = i; window.SILES_Q = i; try { localStorage.setItem('silesmon_quality', i); } catch (e) {}
      [...row.children].forEach((b, k) => b.classList.toggle('on', k === i)); desc.textContent = QD[i];
      if (typeof Game !== 'undefined' && Game.setQuality) Game.setQuality(i);
      if (typeof Game !== 'undefined' && Game.click) Game.click();
    }
    set(q);
    window.openSettings = () => { p.classList.add('open'); };
    p.querySelector('.sx').onclick = () => p.classList.remove('open');
    p.addEventListener('click', e => { if (e.target === p) p.classList.remove('open'); });
    const bo = document.getElementById('btnOpt'); if (bo) bo.addEventListener('click', window.openSettings);
  })();
</script>
<script>
  // Neue Version auf dem Server? Dann einmal frisch laden (der Link bleibt immer gleich)
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
    v = v.trim(); if (v && v !== 'V1.36' && sessionStorage.getItem('silesmon_reload') !== v) { sessionStorage.setItem('silesmon_reload', v); location.reload(); }
  }).catch(() => {});
  // Spieldaten im Hintergrund nachladen, damit das Hauptmenü sofort erscheint
  window.addEventListener('load', () => {
    const s = document.createElement('script'); s.src = 'silesmon-data.js?v=V1.36';
    s.onload = () => { if (window.pendingStart !== undefined) startGame(window.pendingStart); };
    s.onerror = () => toast('Spiel konnte nicht geladen werden. Bitte neu laden.');
    document.body.appendChild(s);
  });
</script>
</body>
